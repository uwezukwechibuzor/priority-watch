version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
    - gofumpt
    - exhaustive
    - noctx
    - bodyclose
    - sqlclosecheck

linters-settings:
  gofumpt:
    extra-rules: true
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: indent-error-flow
      - name: early-return
  gosec:
    excludes:
      - G115  # integer overflow (handled at ingestion boundary)

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - gosec
        - errcheck
