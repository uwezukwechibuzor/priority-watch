apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      username: pw_reader
    secureJsonData:
      password: ${CLICKHOUSE_RO_PASSWORD}
