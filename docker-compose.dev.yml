# Development overrides: live-mount DAGs and dbt project, verbose logs.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

name: priority-watch

services:
  airflow-webserver:
    environment:
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
      # Prevent google-auth from probing the GCP metadata server (169.254.169.254).
      # In Docker Desktop that probe hangs for ~120s, blocking Airflow startup.
      NO_GCE_CHECK: "true"
      GOOGLE_CLOUD_DISABLE_GRPC: "1"

  airflow-scheduler:
    healthcheck:
      test: ["NONE"]
    environment:
      # .env sets CLICKHOUSE_HOST=localhost for local tooling; override to Docker service name.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_RO_USER: ${CLICKHOUSE_RO_USER:-pw_reader}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-readonly}
      # 2 concurrent dbt tasks (~600 MB peak) leaves enough memory headroom for
      # the scheduler's DAG file processor to re-import Cosmos without page-thrashing.
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__LOCAL_EXECUTOR__PARALLELISM: "2"
      # Cosmos reads the 1.3 MB manifest at DAG-parse time.
      # 300s timeout handles worst-case memory pressure; re-parse every 10 min.
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "300"
      AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: "600"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "600"
      # Prevent google-auth from probing the GCP metadata server (169.254.169.254).
      # In Docker Desktop that probe hangs for ~120s, blocking Airflow startup.
      NO_GCE_CHECK: "true"
      GOOGLE_CLOUD_DISABLE_GRPC: "1"
    volumes:
      # Live-mount DAGs and dbt for fast iteration — no rebuild needed.
      # dbt must be writable: Cosmos writes target/partial_parse.msgpack at DAG-parse time.
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./dbt:/opt/airflow/dbt

  airflow-triggerer:
    environment:
      NO_GCE_CHECK: "true"
      GOOGLE_CLOUD_DISABLE_GRPC: "1"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro

  clickhouse:
    # Expose the inter-server port for local ClickHouse client tooling.
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9363:9363"
    # Use lightweight HTTP ping — clickhouse-client startup is slow in Docker Desktop
    # and causes the 5s healthcheck timeout to fire continuously.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 10G

  postgres:
    ports:
      - "5432:5432"

  api:
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
    healthcheck:
      test: ["NONE"]

  follower:
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
    healthcheck:
      test: ["NONE"]
