repos:
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        language: system
        entry: gofumpt -l -w .
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: golangci-lint run
        types: [go]
        pass_filenames: false

      - id: ruff
        name: ruff
        language: system
        entry: ruff check --fix
        types: [python]

      - id: sqlfluff-lint
        name: sqlfluff lint
        language: system
        entry: sqlfluff lint --dialect clickhouse --templater dbt --profiles-dir ./dbt
        types: [sql]
        pass_filenames: true

      - id: biome
        name: biome check
        language: system
        entry: biome check --write
        types_or: [javascript, jsx, ts, tsx, json]
        pass_filenames: true
