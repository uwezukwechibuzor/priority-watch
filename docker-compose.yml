name: priority-watch

# Shared environment blocks (YAML anchors)
x-airflow-common-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfdstY=}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-priority-watch-dev-secret}
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
  # Give DAGs access to the ClickHouse and ingester config
  CLICKHOUSE_ADDR: ${CLICKHOUSE_ADDR:-clickhouse:9000}
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
  CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
  ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
  PGA_ACTIVATION_BLOCK: ${PGA_ACTIVATION_BLOCK:-}
  FOLLOWER_HEALTHZ_URL: ${FOLLOWER_HEALTHZ_URL:-http://pw-follower:9091/healthz}
  CLICKHOUSE_BACKUP_DISK: ${CLICKHOUSE_BACKUP_DISK:-backups}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment:
    <<: *airflow-env
  volumes:
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - pw-net

services:
  # ── ClickHouse 25.x ───────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: pw-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native protocol (clickhouse-go)
      - "9363:9363"   # Prometheus metrics
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-readonly}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-backups:/var/lib/clickhouse/backups
      - ./infra/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      # users.d is writable so the entrypoint can write default-user.xml for CLICKHOUSE_PASSWORD.
      # Our pw-users.xml (pw_reader) coexists safely in the same dir.
      - ./infra/clickhouse/users.d:/etc/clickhouse-server/users.d
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password '${CLICKHOUSE_PASSWORD:-admin}' --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - pw-net
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ── Postgres 16 (Airflow metadata) ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pw-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pw-net

  # ── Airflow: one-shot init (db migrate + admin user) ─────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: pw-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --role Admin \
          --username admin \
          --firstname Admin \
          --lastname Admin \
          --email admin@example.com \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" || true
        echo "airflow-init done"
    restart: "no"

  # ── Airflow webserver / api-server ────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: pw-airflow-webserver
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health | grep -q '\"status\": \"healthy\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # ── Airflow scheduler ─────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: pw-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # ── Airflow triggerer ─────────────────────────────────────────────────────────
  airflow-triggerer:
    <<: *airflow-common
    container_name: pw-airflow-triggerer
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # ── Caddy (TLS reverse proxy) — placeholder, configured in task 20 ────────────
  caddy:
    image: caddy:2-alpine
    container_name: pw-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    profiles:
      - production   # opt-in: docker compose --profile production up
    networks:
      - pw-net

  # ── pw-follower (task 6) ─────────────────────────────────────────────────────
  follower:
    build:
      context: .
      args:
        SERVICE: pw-ingester
    container_name: pw-follower
    command: ["follow"]
    ports:
      - "9091:9091"
    environment:
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      ARBITRUM_WS_URL: ${ARBITRUM_WS_URL:-}
      ARBITRUM_RPC_RPS: ${ARBITRUM_RPC_RPS:-25}
      CLICKHOUSE_ADDR: ${CLICKHOUSE_ADDR:-clickhouse:9000}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      METRICS_ADDR: ":9091"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FOLLOWER_GAP_THRESHOLD: ${FOLLOWER_GAP_THRESHOLD:-1000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles:
      - ingest   # opt-in: docker compose --profile ingest up
    restart: unless-stopped
    networks:
      - pw-net

  # ── pw-api placeholder (task 14) ─────────────────────────────────────────────
  api:
    build:
      context: .
      args:
        SERVICE: pw-api
    container_name: pw-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      API_PORT: "8080"
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:5173}
      CLICKHOUSE_ADDR: ${CLICKHOUSE_ADDR:-clickhouse:9000}
      CLICKHOUSE_RO_USER: ${CLICKHOUSE_RO_USER:-pw_reader}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-readonly}
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - api
    restart: unless-stopped
    networks:
      - pw-net

  # ── apps/web placeholder (task 16) ───────────────────────────────────────────
  web:
    image: node:22-alpine
    container_name: pw-web
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./apps/web:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    profiles:
      - web
    networks:
      - pw-net

volumes:
  clickhouse-data:
  clickhouse-backups:
  postgres-data:
  airflow-logs:
  caddy-data:
  caddy-config:

networks:
  pw-net:
    name: pw-net
    driver: bridge
